name: Build and Push Frontend Image

on:
  # Manual execution
  workflow_dispatch:
  # Automatic on direct push to develop
  push:
    branches:
      - develop
  # Automatic when a PR to develop or main is closed/merged
  pull_request:
    types: [closed]
    branches:
      - develop
      - main

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    # Run on push to develop OR on a merged pull request to develop/main
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    permissions:
      contents: read
      actions: write

    env:
      DOCKERHUB_REPO: carlosmca/envialo-web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # If it's a pull_request, checkout the merge commit
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag suffix
        id: tag-suffix
        run: |
          # If it's a pull_request merged to main, use prod
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ] && [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "suffix=prod" >> $GITHUB_OUTPUT
          else
            echo "suffix=dev" >> $GITHUB_OUTPUT
          fi

      - name: Get commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=${{ steps.tag-suffix.outputs.suffix }}
            type=raw,value=${{ steps.tag-suffix.outputs.suffix }}-${{ steps.sha.outputs.sha }}

      - name: Set build args
        id: build-args
        run: |
          ENV_SUFFIX="${{ steps.tag-suffix.outputs.suffix }}"
          
          if [ "$ENV_SUFFIX" = "prod" ]; then
            API_BASE_URL="${API_BASE_URL_PROD:-${API_BASE_URL:-https://api.envialo.brinxpress.com}}"
          else
            API_BASE_URL="${API_BASE_URL_DEV:-${API_BASE_URL:-https://api.envialo.brinxpress.com}}"
          fi
          
          echo "API_BASE_URL=$API_BASE_URL" >> $GITHUB_ENV
          echo "=== Build Environment: $ENV_SUFFIX ==="
          echo "API_BASE_URL=$API_BASE_URL"
        env:
          API_BASE_URL_DEV: ${{ vars.API_BASE_URL_DEV }}
          API_BASE_URL_PROD: ${{ vars.API_BASE_URL_PROD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
